name: Sync KRTV Korean channels

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/sync_krtv.py
      - .github/workflows/sync-krtv.yml

permissions:
  contents: write

concurrency:
  group: sync-krtv-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - name: Download and filter exact Korean group
        run: python3 scripts/sync_krtv.py
      - name: Commit playlist if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- KRTV.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update KRTV Korean playlist'
          git push origin HEAD:master
